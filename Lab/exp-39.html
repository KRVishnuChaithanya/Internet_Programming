<!DOCTYPE html>
<html>
<head>

<title>Online Store</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

header {
    background: #1976d2;
    color: white;
    padding: 25px;
    text-align: center;
}

nav {
    background: #0d47a1;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
}

.search {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.search input,
.search select {
    padding: 12px;
    margin: 5px;
}

.products {
    display: grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
    gap: 20px;
    margin-top: 20px;
}

.product {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px #bbb;
}

.product h2 {
    color: #1976d2;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

button {
    background: #1976d2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    cursor: pointer;
}

.cart {
    background: white;
    padding: 25px;
    margin-top: 30px;
    border-radius: 10px;
}

.checkout {
    background: white;
    padding: 30px;
    margin-top: 30px;
    border-radius: 10px;
}

.checkout input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
}

footer {
    background: #0d47a1;
    color: white;
    padding: 20px;
    text-align: center;
    margin-top: 40px;
}

</style>

</head>

<body>

<header>

<h1>🛒 Online Store</h1>

<p>Shop Products Easily</p>

</header>

<nav>

<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart</a>
<a href="#checkout">Checkout</a>

</nav>

<div class="container">

<div class="search">

<input type="text"
       id="search"
       placeholder="Search products"
       onkeyup="filterProducts()">

<select id="category"
        onchange="filterProducts()">

<option value="">All Categories</option>
<option value="Electronics">Electronics</option>
<option value="Clothing">Clothing</option>
<option value="Accessories">Accessories</option>

</select>

</div>

<div class="products" id="products">

<div class="product"
     data-name="Laptop"
     data-category="Electronics">

<h2>Laptop</h2>
<p>Powerful laptop for work.</p>
<p class="price">₹55,000</p>

<button onclick="addCart('Laptop',55000)">
Add to Cart
</button>

</div>

<div class="product"
     data-name="Headphones"
     data-category="Electronics">

<h2>Headphones</h2>
<p>Wireless headphones.</p>
<p class="price">₹2,000</p>

<button onclick="addCart('Headphones',2000)">
Add to Cart
</button>

</div>

<div class="product"
     data-name="T Shirt"
     data-category="Clothing">

<h2>T-Shirt</h2>
<p>Cotton casual T-shirt.</p>
<p class="price">₹800</p>

<button onclick="addCart('T-Shirt',800)">
Add to Cart
</button>

</div>

<div class="product"
     data-name="Watch"
     data-category="Accessories">

<h2>Watch</h2>
<p>Stylish wrist watch.</p>
<p class="price">₹1,500</p>

<button onclick="addCart('Watch',1500)">
Add to Cart
</button>

</div>

</div>

<div class="cart" id="cart">

<h2>Shopping Cart</h2>

<div id="cartItems"></div>

<h3 id="total">Total: ₹0</h3>

<button onclick="clearCart()">
Clear Cart
</button>

</div>

<div class="checkout" id="checkout">

<h2>Checkout</h2>

<form onsubmit="checkout(event)">

<input id="customer"
       placeholder="Customer Name"
       required>

<input type="email"
       id="email"
       placeholder="Email"
       required>

<input id="address"
       placeholder="Shipping Address"
       required>

<button type="submit">
Place Order
</button>

</form>

<p id="orderResult"></p>

</div>

</div>

<footer>

© 2026 Online Store

</footer>

<script>

let cart = [];

function addCart(name, price) {

    cart.push({
        name: name,
        price: price
    });

    displayCart();

    alert(name + " added to cart.");

}

function displayCart() {

    let container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;

    cart.forEach(function(item, index) {

        total += item.price;

        container.innerHTML +=
            "<p>" +
            item.name +
            " - ₹" +
            item.price +
            " <button onclick='removeCart(" +
            index +
            ")'>Remove</button></p>";

    });

    document.getElementById("total").innerHTML =
        "Total: ₹" + total;

}

function removeCart(index) {

    cart.splice(index, 1);

    displayCart();

}

function clearCart() {

    cart = [];

    displayCart();

}

function filterProducts() {

    let search =
        document.getElementById("search")
        .value.toLowerCase();

    let category =
        document.getElementById("category").value;

    let products =
        document.querySelectorAll(".product");

    products.forEach(function(product) {

        let name =
            product.dataset.name.toLowerCase();

        let type =
            product.dataset.category;

        if (
            name.includes(search) &&
            (category === "" || category === type)
        ) {

            product.style.display = "block";

        } else {

            product.style.display = "none";

        }

    });

}

function checkout(event) {

    event.preventDefault();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }

    let orders =
        JSON.parse(localStorage.getItem("storeOrders")) || [];

    orders.push({

        customer:
            document.getElementById("customer").value,

        email:
            document.getElementById("email").value,

        address:
            document.getElementById("address").value,

        items: cart,

        date:
            new Date().toLocaleString()

    });

    localStorage.setItem(
        "storeOrders",
        JSON.stringify(orders)
    );

    document.getElementById("orderResult").innerHTML =
        "Order placed successfully!";

    cart = [];

    displayCart();

    event.target.reset();

}

displayCart();

</script>

</body>
</html>
