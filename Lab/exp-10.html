<!DOCTYPE html>
<html>
<head>

    <title>StyleHub - Fashion Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #fff5f8;
        }

        header {
            background: #c2185b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #880e4f;
            padding: 12px;
            text-align: center;
        }

        nav button {
            background: white;
            color: #880e4f;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background: #c2185b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #880e4f;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .cart {
            border-left: 5px solid #c2185b;
            padding: 15px;
            margin: 10px 0;
            background: #fff8fa;
        }

        .delete {
            background: #d32f2f;
        }

        .review {
            background: #fce4ec;
            padding: 10px;
            margin-top: 10px;
        }

    </style>

</head>

<body>

<header>

    <h1>StyleHub</h1>

    <p>
        Fashion for Men, Women and Children
    </p>

</header>

<nav>

    <button onclick="showProducts()">
        Products
    </button>

    <button onclick="showCart()">
        Cart
    </button>

    <button onclick="showOrders()">
        Orders
    </button>

</nav>


<div class="container">

    <!-- ADD PRODUCT -->

    <div class="card">

        <h2>Add Fashion Product</h2>

        <input
            type="text"
            id="name"
            placeholder="Product name">

        <input
            type="number"
            id="price"
            placeholder="Price">

        <select id="category">

            <option value="Men">
                Men
            </option>

            <option value="Women">
                Women
            </option>

            <option value="Children">
                Children
            </option>

            <option value="Footwear">
                Footwear
            </option>

            <option value="Accessories">
                Accessories
            </option>

        </select>

        <select id="size">

            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>

        </select>

        <button onclick="addProduct()">
            Add Product
        </button>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

        <h2>Fashion Products</h2>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
            onkeyup="displayProducts()">

        <select
            id="filter"
            onchange="displayProducts()">

            <option value="All">
                All Categories
            </option>

            <option value="Men">
                Men
            </option>

            <option value="Women">
                Women
            </option>

            <option value="Children">
                Children
            </option>

            <option value="Footwear">
                Footwear
            </option>

            <option value="Accessories">
                Accessories
            </option>

        </select>

        <div id="products"></div>

    </div>


    <!-- CART -->

    <div class="card">

        <h2>Shopping Cart</h2>

        <div id="cart"></div>

        <h3>
            Total: ₹<span id="total">0</span>
        </h3>

        <button onclick="checkout()">
            Checkout
        </button>

    </div>


    <!-- ORDERS -->

    <div class="card">

        <h2>My Orders</h2>

        <div id="orders"></div>

    </div>


    <!-- REVIEWS -->

    <div class="card">

        <h2>Product Review</h2>

        <input
            type="text"
            id="reviewProduct"
            placeholder="Product name">

        <textarea
            id="reviewText"
            placeholder="Write your review">
        </textarea>

        <button onclick="addReview()">
            Submit Review
        </button>

        <div id="reviews"></div>

    </div>

</div>


<script>

let products =
    JSON.parse(localStorage.getItem("styleProducts")) || [];

let cart =
    JSON.parse(localStorage.getItem("styleCart")) || [];

let orders =
    JSON.parse(localStorage.getItem("styleOrders")) || [];

let reviews =
    JSON.parse(localStorage.getItem("styleReviews")) || [];


function addProduct() {

    let name =
        document.getElementById("name").value;

    let price =
        document.getElementById("price").value;

    let category =
        document.getElementById("category").value;

    let size =
        document.getElementById("size").value;

    if (name === "" || price === "") {

        alert("Please enter product details");

        return;
    }

    products.push({

        name: name,

        price: Number(price),

        category: category,

        size: size

    });

    localStorage.setItem(
        "styleProducts",
        JSON.stringify(products)
    );

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";

    displayProducts();

    alert("Product added successfully!");

}


function displayProducts() {

    let list =
        document.getElementById("products");

    let search =
        document.getElementById("search")
        .value.toLowerCase();

    let filter =
        document.getElementById("filter").value;

    list.innerHTML = "";

    products.forEach(function(product, index) {

        let matchesSearch =
            product.name.toLowerCase()
            .includes(search);

        let matchesCategory =
            filter === "All" ||
            product.category === filter;

        if (matchesSearch && matchesCategory) {

            list.innerHTML += `

                <div class="product">

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        Category:
                        ${product.category}
                    </p>

                    <p>
                        Size:
                        ${product.size}
                    </p>

                    <p>
                        Price:
                        ₹${product.price}
                    </p>

                    <button
                        onclick="addToCart(${index})">

                        Add to Cart

                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct(${index})">

                        Delete

                    </button>

                </div>

            `;

        }

    });

}


function deleteProduct(index) {

    products.splice(index, 1);

    localStorage.setItem(
        "styleProducts",
        JSON.stringify(products)
    );

    displayProducts();

}


function addToCart(index) {

    cart.push(products[index]);

    localStorage.setItem(
        "styleCart",
        JSON.stringify(cart)
    );

    displayCart();

    alert("Added to cart!");

}


function displayCart() {

    let list =
        document.getElementById("cart");

    let total = 0;

    list.innerHTML = "";

    if (cart.length === 0) {

        list.innerHTML =
            "<p>Your cart is empty.</p>";

    }

    cart.forEach(function(item, index) {

        total += item.price;

        list.innerHTML += `

            <div class="cart">

                <h3>
                    ${item.name}
                </h3>

                <p>
                    Size: ${item.size}
                </p>

                <p>
                    Price: ₹${item.price}
                </p>

                <button
                    class="delete"
                    onclick="removeFromCart(${index})">

                    Remove

                </button>

            </div>

        `;

    });

    document.getElementById("total")
        .innerText = total;

}


function removeFromCart(index) {

    cart.splice(index, 1);

    localStorage.setItem(
        "styleCart",
        JSON.stringify(cart)
    );

    displayCart();

}


function checkout() {

    if (cart.length === 0) {

        alert("Cart is empty!");

        return;

    }

    let order = {

        orderId: Date.now(),

        products: cart,

        total: cart.reduce(
            (sum, item) =>
            sum + item.price, 0
        ),

        status: "Order Placed"

    };

    orders.push(order);

    localStorage.setItem(
        "styleOrders",
        JSON.stringify(orders)
    );

    cart = [];

    localStorage.setItem(
        "styleCart",
        JSON.stringify(cart)
    );

    displayCart();
    displayOrders();

    alert("Order placed successfully!");

}


function displayOrders() {

    let list =
        document.getElementById("orders");

    list.innerHTML = "";

    if (orders.length === 0) {

        list.innerHTML =
            "<p>No orders yet.</p>";

        return;

    }

    orders.forEach(function(order) {

        list.innerHTML += `

            <div class="cart">

                <h3>
                    Order ID:
                    ${order.orderId}
                </h3>

                <p>
                    Total:
                    ₹${order.total}
                </p>

                <p>
                    Status:
                    ${order.status}
                </p>

            </div>

        `;

    });

}


function addReview() {

    let product =
        document.getElementById("reviewProduct")
        .value;

    let text =
        document.getElementById("reviewText")
        .value;

    if (product === "" || text === "") {

        alert("Enter product and review");

        return;

    }

    reviews.push({

        product: product,

        text: text

    });

    localStorage.setItem(
        "styleReviews",
        JSON.stringify(reviews)
    );

    document.getElementById("reviewProduct")
        .value = "";

    document.getElementById("reviewText")
        .value = "";

    displayReviews();

}


function displayReviews() {

    let list =
        document.getElementById("reviews");

    list.innerHTML = "";

    reviews.forEach(function(review) {

        list.innerHTML += `

            <div class="review">

                <b>
                    ${review.product}
                </b>

                <p>
                    ${review.text}
                </p>

            </div>

        `;

    });

}


function showProducts() {

    document.getElementById("products")
        .scrollIntoView();

}


function showCart() {

    document.getElementById("cart")
        .scrollIntoView();

}


function showOrders() {

    document.getElementById("orders")
        .scrollIntoView();

}


displayProducts();
displayCart();
displayOrders();
displayReviews();

</script>

</body>
</html>
