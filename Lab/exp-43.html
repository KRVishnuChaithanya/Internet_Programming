<!DOCTYPE html>
<html>

<head>

    <title>Placement Examination</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7fb;
        }

        header {
            background: #283593;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px #ccc;
        }

        h2 {
            color: #283593;
        }

        button {
            background: #283593;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1a237e;
        }

        .question {
            margin-bottom: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .result {
            background: #e8eaf6;
            padding: 20px;
            border-radius: 8px;
        }

        footer {
            background: #283593;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>

</head>

<body>

<header>

    <h1>🎓 Online Placement Examination</h1>

    <p>Candidate Examination Portal</p>

</header>


<div class="container">


    <div class="card">

        <h2>Candidate Login</h2>

        <input
            id="candidate"
            placeholder="Enter candidate name"
            style="width:100%;padding:12px;">

        <button onclick="startExam()">
            Start Examination
        </button>

    </div>


    <div
        id="exam"
        class="card"
        style="display:none;">

        <h2>Placement Test</h2>

        <form id="examForm">

            <div class="question">

                <p>
                    1. Which language is used
                    for webpage structure?
                </p>

                <label>
                    <input
                        type="radio"
                        name="q1"
                        value="HTML">
                    HTML
                </label>

                <br>

                <label>
                    <input
                        type="radio"
                        name="q1"
                        value="CSS">
                    CSS
                </label>

            </div>


            <div class="question">

                <p>
                    2. Which language is mainly
                    used for webpage styling?
                </p>

                <label>
                    <input
                        type="radio"
                        name="q2"
                        value="HTML">
                    HTML
                </label>

                <br>

                <label>
                    <input
                        type="radio"
                        name="q2"
                        value="CSS">
                    CSS
                </label>

            </div>


            <div class="question">

                <p>
                    3. Which language provides
                    client-side programming?
                </p>

                <label>
                    <input
                        type="radio"
                        name="q3"
                        value="JavaScript">
                    JavaScript
                </label>

                <br>

                <label>
                    <input
                        type="radio"
                        name="q3"
                        value="SQL">
                    SQL
                </label>

            </div>


            <button type="button"
                    onclick="submitExam()">

                Submit Examination

            </button>

        </form>

    </div>


    <div
        id="result"
        class="card"
        style="display:none;">

    </div>

</div>


<footer>

    © 2026 Placement Examination Portal

</footer>


<script>

    let candidateName = "";


    function startExam() {

        candidateName =
            document.getElementById(
                "candidate"
            ).value;

        if (candidateName === "") {

            alert(
                "Please enter candidate name."
            );

            return;

        }

        document.getElementById(
            "exam"
        ).style.display = "block";

        window.scrollTo({
            top: 300,
            behavior: "smooth"
        });

    }


    function submitExam() {

        let score = 0;


        if (
            document.querySelector(
                'input[name="q1"]:checked'
            )?.value === "HTML"
        ) {

            score++;

        }


        if (
            document.querySelector(
                'input[name="q2"]:checked'
            )?.value === "CSS"
        ) {

            score++;

        }


        if (
            document.querySelector(
                'input[name="q3"]:checked'
            )?.value === "JavaScript"
        ) {

            score++;

        }


        let percentage =
            (score / 3) * 100;


        let status =
            percentage >= 50
            ? "PASSED"
            : "FAILED";


        let result = {

            candidate: candidateName,
            score: score,
            total: 3,
            percentage: percentage,
            status: status

        };


        localStorage.setItem(
            "placementResult",
            JSON.stringify(result)
        );


        document.getElementById(
            "result"
        ).style.display = "block";


        document.getElementById(
            "result"
        ).innerHTML =

            "<h2>Examination Result</h2>" +

            "<p><strong>Candidate:</strong> " +
            candidateName +
            "</p>" +

            "<p><strong>Score:</strong> " +
            score +
            " / 3</p>" +

            "<p><strong>Percentage:</strong> " +
            percentage.toFixed(2) +
            "%</p>" +

            "<h3>" +
            status +
            "</h3>";

    }

</script>

</body>

</html>
