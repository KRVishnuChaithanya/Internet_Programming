<!DOCTYPE html>
<html>

<head>

    <title>Income Tax Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #eef4f8;
        }

        header {
            background: #00695c;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ccc;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #00695c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            background: #e0f2f1;
            padding: 20px;
            margin-top: 25px;
            border-radius: 8px;
        }

        footer {
            background: #00695c;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

    </style>

</head>

<body>

<header>

    <h1>💰 Income Tax Calculator</h1>

    <p>Employee Tax Calculation Portal</p>

</header>


<div class="container">

    <div class="card">

        <h2>Enter Financial Details</h2>


        <label>
            Monthly Gross Pay
        </label>

        <input
            type="number"
            id="gross"
            placeholder="Enter monthly gross pay">


        <label>
            Monthly House Rent Allowance
        </label>

        <input
            type="number"
            id="hra"
            placeholder="Enter HRA">


        <label>
            Monthly Pension
        </label>

        <input
            type="number"
            id="pension"
            placeholder="Enter pension">


        <label>
            Monthly Health Insurance
        </label>

        <input
            type="number"
            id="health"
            placeholder="Enter health insurance">


        <button onclick="calculateTax()">
            Calculate Tax
        </button>


        <div
            id="result"
            class="result"
            style="display:none;">
        </div>

    </div>

</div>


<footer>

    © 2026 Income Tax Calculator

</footer>


<script>

    function calculateTax() {

        let gross =
            Number(
                document.getElementById(
                    "gross"
                ).value
            );

        let hra =
            Number(
                document.getElementById(
                    "hra"
                ).value
            );

        let pension =
            Number(
                document.getElementById(
                    "pension"
                ).value
            );

        let health =
            Number(
                document.getElementById(
                    "health"
                ).value
            );


        if (gross < 0 ||
            hra < 0 ||
            pension < 0 ||
            health < 0) {

            alert(
                "Please enter valid values."
            );

            return;

        }


        let annualGross =
            gross * 12;

        let annualHRA =
            hra * 12;

        let annualPension =
            Math.min(
                pension * 12,
                150000
            );

        let annualHealth =
            health * 12;


        let standardDeduction =
            50000;


        let taxable =
            annualGross
            - annualHRA
            - standardDeduction
            - annualPension
            - annualHealth;


        if (taxable < 0) {

            taxable = 0;

        }


        let tax = 0;


        if (taxable <= 250000) {

            tax = 0;

        } else if (taxable <= 500000) {

            tax =
                0.05 *
                (taxable - 250000);

        } else if (taxable <= 1000000) {

            tax =
                12500 +
                0.20 *
                (taxable - 500000);

        } else {

            tax =
                112500 +
                0.30 *
                (taxable - 1000000);

        }


        let netIncome =
            annualGross - tax;


        document.getElementById(
            "result"
        ).style.display = "block";


        document.getElementById(
            "result"
        ).innerHTML =

            "<h2>Tax Calculation Result</h2>" +

            "<p><strong>Annual Gross Pay:</strong> ₹" +
            annualGross.toFixed(2) +
            "</p>" +

            "<p><strong>Net Taxable Income:</strong> ₹" +
            taxable.toFixed(2) +
            "</p>" +

            "<p><strong>Tax Liability:</strong> ₹" +
            tax.toFixed(2) +
            "</p>" +

            "<p><strong>Net Income After Tax:</strong> ₹" +
            netIncome.toFixed(2) +
            "</p>" +

            "<p><strong>Tax Saving Tip:</strong> " +
            "Maintain eligible deductions and investments " +
            "to reduce taxable income where applicable." +
            "</p>";


        localStorage.setItem(

            "taxCalculation",

            JSON.stringify({

                annualGross: annualGross,
                taxableIncome: taxable,
                tax: tax,
                netIncome: netIncome

            })

        );

    }

</script>

</body>

</html>
